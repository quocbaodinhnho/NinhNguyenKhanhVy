<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thắng Andy – Quảng cáo, in ấn, bảng hiệu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <h1 id="shopName">Thắng Andy</h1>
    <p id="tagline"></p>
    <form id="searchForm" role="search">
      <input id="q" type="search" placeholder="Tìm sản phẩm, ví dụ: bảng hiệu" aria-label="Tìm sản phẩm">
      <button type="submit">Tìm kiếm</button>
    </form>
  </div>
</header>
<main class="wrap">
  <nav id="cats" aria-label="Danh mục"></nav>
  <p id="count" aria-live="polite"></p>
  <section id="grid"></section>
</main>
<footer class="foot">
  <div class="wrap" id="contact"></div>
</footer>
<div id="lightbox" hidden><img alt=""><p></p></div>
<script src="script.js"></script>
</body>
</html>
