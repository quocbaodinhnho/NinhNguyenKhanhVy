<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Story 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hearts" aria-hidden="true"></div>
  <button id="musicBtn" class="music-btn hidden" title="Bật/tắt nhạc">🎵</button>

  <header class="hero">
    <p class="eyebrow">Câu chuyện của chúng mình</p>
    <h1 id="names"></h1>
    <p id="tagline" class="tagline"></p>

    <div class="counter-card">
      <div class="big"><span id="totalDays">0</span><small>ngày yêu nhau</small></div>
      <div id="ymd" class="ymd"></div>
      <div class="clock">
        <div><b id="hh">00</b><span>giờ</span></div>
        <div><b id="mm">00</b><span>phút</span></div>
        <div><b id="ss">00</b><span>giây</span></div>
      </div>
    </div>

    <p id="nextAnniv" class="next"></p>
    <a href="#timeline" class="scroll" aria-label="Cuộn xuống">↓</a>
  </header>

  <section id="timeline" class="section">
    <h2>Chặng đường của mình</h2>
    <div id="timelineList" class="timeline"></div>
  </section>

  <section id="gallery" class="section">
    <h2>Khoảnh khắc của chúng mình</h2>
    <div id="galleryGrid" class="grid"></div>
  </section>

  <section id="reasons" class="section">
    <h2 id="reasonsTitle"></h2>
    <div class="reason-card">
      <p id="reasonText">Bấm nút bên dưới nhé 💗</p>
      <button id="reasonBtn" type="button">Xem một điều nữa</button>
    </div>
  </section>

  <section id="letter" class="section">
    <h2 id="letterTitle"></h2>
    <div class="letter">
      <p id="letterBody"></p>
      <p id="letterSign" class="sign"></p>
    </div>
  </section>

  <footer id="footer"></footer>

  <div id="lightbox" class="lightbox hidden">
    <img id="lightboxImg" alt="" />
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
